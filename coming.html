<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coming Soon | PantryChef</title>


<style>

/* ====== GLOBAL ====== */

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}


body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    linear-gradient(135deg,#fff7ed,#ffe0b2);

    overflow:hidden;

}



/* ====== BACKGROUND EFFECTS ====== */


body::before{

    content:"";

    position:absolute;

    width:450px;

    height:450px;

    background:#ff9800;

    border-radius:50%;

    top:-200px;

    left:-150px;

    opacity:0.18;

}



body::after{

    content:"";

    position:absolute;

    width:400px;

    height:400px;

    background:#ffb74d;

    border-radius:50%;

    bottom:-180px;

    right:-120px;

    opacity:0.25;

}



/* floating food */


.food{

    position:absolute;

    font-size:45px;

    animation:floating 4s infinite ease-in-out;

}


.food:nth-child(1){

    top:15%;

    left:15%;

}



.food:nth-child(2){

    top:20%;

    right:15%;

    animation-delay:1s;

}



.food:nth-child(3){

    bottom:15%;

    left:20%;

    animation-delay:2s;

}



.food:nth-child(4){

    bottom:18%;

    right:20%;

    animation-delay:1.5s;

}



@keyframes floating{

    50%{

        transform:translateY(-25px) rotate(5deg);

    }

}





/* ====== CARD ====== */


.container{

    position:relative;

    z-index:2;


    width:90%;

    max-width:650px;


    padding:50px;


    text-align:center;


    background:rgba(255,255,255,0.7);


    backdrop-filter:blur(20px);


    border-radius:35px;


    border:1px solid rgba(255,255,255,0.8);


    box-shadow:
    0 25px 60px rgba(0,0,0,0.15);


}



/* ====== LOGO ====== */


.logo{

    font-size:38px;

    font-weight:700;

    color:#333;

    margin-bottom:25px;

}


.logo span{

    color:#ff8c00;

}





/* ====== ICON ====== */


.icon{

    font-size:90px;

    margin-bottom:20px;


    animation:bounce 2s infinite;

}



@keyframes bounce{

    50%{

        transform:translateY(-15px);

    }

}





/* ====== TITLE ====== */


h1{

    font-size:55px;

    color:#ff8c00;

    margin-bottom:15px;

    letter-spacing:1px;

}





/* ====== TEXT ====== */


p{

    color:#555;

    font-size:18px;

    line-height:1.8;

    margin-bottom:35px;

}

.btn{


text-decoration:none;


display:inline-block;


padding:16px 40px;


color:white;


background:linear-gradient(
45deg,
#ff8c00,
#ffb347
);


border-radius:50px;


font-weight:600;


font-size:16px;


box-shadow:
0 10px 25px rgba(255,140,0,0.35);


transition:0.4s;


}



.btn:hover{

    transform:translateY(-6px) scale(1.05);

    box-shadow:
    0 15px 35px rgba(255,140,0,0.5);

}





/*footer  */


.footer{

    margin-top:35px;

    color:#777;

    font-size:13px;

}



</style>

</head>



<body>



<!-- Floating food decoration -->

<div class="food">🍰</div>

<div class="food">🥗</div>

<div class="food">🍓</div>

<div class="food">🍪</div>
